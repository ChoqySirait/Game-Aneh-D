<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeonPulse Arcade | Ultra Responsive Web Canvas</title>
  
  <!-- Font Google: Orbitron untuk header arcade & Rajdhani untuk teks UI yang tajam -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Animated Cyber Glow -->
  <div class="ambient-glow bg-cyan"></div>
  <div class="ambient-glow bg-magenta"></div>

  <main class="arcade-cabinet">
    <!-- Header Arcade dengan Animasi Glitch Glow -->
    <header class="arcade-header">
      <div class="badge-status">
        <span class="live-dot"></span> SYSTEM READY (60 FPS)
      </div>
      <h1 class="glitch-title" data-text="NEON PULSE">NEON PULSE</h1>
      <p class="subtitle">MICRO-ARCADE ENGINE // VANILLA JS</p>
    </header>

    <!-- Menu Pemilihan Game Bergaya Tab Konsol -->
    <nav class="game-nav" aria-label="Game Selection">
      <button class="game-tab active" onclick="switchGame('flappy', event)">
        <span class="icon">🦅</span>
        <span class="tab-label">FLAPPY EAGLE</span>
        <span class="glow-indicator"></span>
      </button>
      <button class="game-tab" onclick="switchGame('snake', event)">
        <span class="icon">🐍</span>
        <span class="tab-label">CYBER SNAKE</span>
        <span class="glow-indicator"></span>
      </button>
      <button class="game-tab" onclick="switchGame('memory', event)">
        <span class="icon">🧠</span>
        <span class="tab-label">MEMORY MATRIX</span>
        <span class="glow-indicator"></span>
      </button>
    </nav>

    <!-- Canvas Frame Unit dengan Screen Effect (CRT Scanlines & Glass Glare) -->
    <div class="viewport-frame">
      <div class="crt-scanline"></div>
      <div class="crt-vignette"></div>
      <div class="crt-glare"></div>
      
      <canvas id="gameCanvas" width="720" height="1080"></canvas>
    </div>

    <!-- HUD Dynamic Instruction Box -->
    <footer class="hud-panel">
      <div class="hud-terminal-header">
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-title">INPUT CONTROLLER</span>
      </div>
      <div class="hud-content" id="gameInfo">
        Memuat modul kontrol...
      </div>
    </footer>
  </main>

  <!-- Script Modules -->
<!-- PASTIKAN main.js ADA DI PALING ATAS -->
  <script src="js/main.js"></script>
  <script src="js/flappy.js"></script>
  <script src="js/snake.js"></script>
  <script src="js/memory.js"></script>
</body>
</html>
