<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CyberBrawl 2D // Neon Protocol</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Kanvas Utama Game Layar Penuh -->
  <canvas id="gameCanvas"></canvas>

  <!-- Overlay UI / HUD MOBA -->
  <div id="hudLayer">
    <!-- Top-Left: Player Stats Card -->
    <div class="hud-card player-stats">
      <div class="player-header">
        <span class="badge-level" id="hudPlayerLevel">LV. 1</span>
        <span class="player-name">CYBER_OPERATOR</span>
      </div>
      <div class="bar-container hp-bar-bg">
        <div class="bar-fill hp-bar-fill" id="hudHpBar"></div>
        <span class="bar-text" id="hudHpText">100 / 100</span>
      </div>
      <div class="bar-container exp-bar-bg">
        <div class="bar-fill exp-bar-fill" id="hudExpBar"></div>
        <span class="bar-text" id="hudExpText">0 / 100 XP</span>
      </div>
    </div>

    <!-- Top-Right: Radar Minimap & Match Tracker -->
    <div class="hud-top-right">
      <div class="hud-card match-info">
        <span class="alive-counter">OPERATORS: <b id="hudAliveCount">10</b></span>
        <span class="kill-counter">KILLS: <b id="hudKillCount">0</b></span>
      </div>
      <div class="minimap-wrapper">
        <canvas id="minimapCanvas" width="160" height="160"></canvas>
      </div>
    </div>

    <!-- Bottom-Center: Skill Cooldown & Action Deck -->
    <div class="skill-deck">
      <div class="skill-slot" id="slotDash">
        <span class="skill-key">SPACE</span>
        <span class="skill-icon">⚡</span>
        <span class="skill-name">BLINK</span>
        <div class="cooldown-overlay" id="cdDash"></div>
      </div>
      <div class="skill-slot" id="slotUltimate">
        <span class="skill-key">E / R-CLICK</span>
        <span class="skill-icon">🌀</span>
        <span class="skill-name">SINGULARITY</span>
        <div class="cooldown-overlay" id="cdUltimate"></div>
      </div>
    </div>
  </div>

  <!-- Pemuatan Modul Skrip (Sprint 1) -->
  <script src="js/core/camera.js"></script>
  <script src="js/world/map.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
